# render.yaml — Render Blueprint
# Converted from docker-compose.yml

databases:
  # Render-managed Postgres — replaces the 'db' Docker Compose service.
  - name: central-db
    databaseName: central_db
    user: admin
    plan: free

services:
  # MinIO as a private service — only reachable internally by other Render services.
  # Ephemeral: data will be lost on restarts (fine for non-production use).
  - type: pserv
    name: minio
    runtime: image
    image:
      url: docker.io/minio/minio:latest
    startCommand: server /data --console-address ":9001"
    envVars:
      - key: MINIO_ROOT_USER
        value: admin
      - key: MINIO_ROOT_PASSWORD
        value: password123
      # Tells Render which port MinIO's API listens on internally
      - key: PORT
        value: 9000

  # Main Streamlit app — built from your Dockerfile
  - type: web
    name: app
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Render automatically injects the correct connection string for central-db
      - key: DATABASE_URL
        fromDatabase:
          name: central-db
          property: connectionString
      # Internal hostname Render assigns to the minio private service above
      - key: MINIO_ENDPOINT
        value: minio
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_ROOT_USER
        value: admin
      - key: MINIO_ROOT_PASSWORD
        value: password123
