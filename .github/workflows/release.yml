name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

  workflow_dispatch:
      inputs:
        reason:
          description: 'Reason for manual release'
          required: false
          default: 'Manual trigger'
        
# Global permissions kept minimal; job-level overrides applied.
permissions:
  contents: read

concurrency: release

jobs:
  release:
    name: Build and Release Python Package
    runs-on: arc-runner-cse120
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    permissions:
      contents: write
      packages: write
    
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    
    steps:

      - name: Log the Manual Reason
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual Release Reason: ${{ github.event.inputs.reason }}"
        
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - id: release
        name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@master
        with:
          github_token: ${{ steps.generate_token.outputs.token }}

      - name: Publish Release (GitHub)
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@main
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

  docker:
    name: Build and Release Docker Image
    needs: release
    runs-on: arc-runner-cse120
    if: needs.release.outputs.released == 'true'
    
    permissions:
      contents: read
      packages: write
      id-token: write
    
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Format repo slug
        uses: actions/github-script@v8
        id: repo_slug
        with:
          result-encoding: string
          script: return `ghcr.io/${github.repository.toLowerCase()}`

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-to: type=inline,mode=max
